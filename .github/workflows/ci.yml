name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DINKSTER_CORE_REVISION: 444328290949f58d0693ca2b4491b1c55817db1a

jobs:
  validation:
    name: format, lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_CORE_REVISION }}
          path: .dinkster
          ssh-key: ${{ secrets.DINKSTER_CORE_READ_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --project .dinkster --locked
      - run: uv pip install --python .dinkster/.venv/bin/python --no-cache --no-deps --no-sources --reinstall .
      - run: uvx ruff==0.15.22 format --check src tests
      - run: uvx ruff==0.15.22 check src tests
      - run: uvx pyright==1.1.411
      - run: .dinkster/.venv/bin/python -m pytest -q

  artifact-smoke:
    name: artifact smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kosinkadink/Dinkster
          ref: ${{ env.DINKSTER_CORE_REVISION }}
          path: .dinkster
          ssh-key: ${{ secrets.DINKSTER_CORE_READ_KEY }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --project .dinkster --locked --package dinkster-p2p
      - run: uv pip install --python .dinkster/.venv/bin/python --no-cache --no-deps --no-sources --reinstall .
      - run: cp .dinkster/uv.lock uv.lock
        if: runner.os != 'Windows'
      - run: Copy-Item .dinkster/uv.lock uv.lock
        if: runner.os == 'Windows'
      - run: .dinkster/.venv/bin/python -m pytest -q tests/test_p2p_artifact_smoke.py
