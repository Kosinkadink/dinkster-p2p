[project]
name = "dinkster-p2p"
version = "0.0.1"
description = "Dinkster host-managed libtorrent sidecar"
requires-python = ">=3.12"
dependencies = [
    "dinkster-assets",
    "dinkster-workers",
    "psutil>=5.9",
    "libtorrent==2.1.1; python_version >= '3.12' and python_version < '3.14' and platform_python_implementation == 'CPython' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "libtorrent==2.1.1; python_version >= '3.12' and python_version < '3.14' and platform_python_implementation == 'CPython' and sys_platform == 'linux' and platform_machine == 'aarch64'",
    "libtorrent==2.1.1; python_version >= '3.12' and python_version < '3.14' and platform_python_implementation == 'CPython' and sys_platform == 'win32' and platform_machine == 'AMD64'",
    "libtorrent==2.1.1; python_version >= '3.12' and python_version < '3.14' and platform_python_implementation == 'CPython' and sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
dinkster-p2p = "dinkster_p2p.runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dinkster_p2p"]
